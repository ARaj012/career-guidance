name: Weekly Data Automation

on:
  schedule:
    # Run every Sunday at 12:00 AM UTC (5:30 AM IST)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      
      - name: Show commit info
        run: |
          echo "Current commit:"
          git log -1 --oneline
          echo "Branch:"
          git branch --show-current
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Install dependencies
        run: |
          cd apps/web
          npm ci
      
      - name: Run GATE Exam Automation
        run: |
          cd apps/web
          npx tsx scripts/automation.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.CAREER_GUIDANCE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      
      - name: Create summary
        run: |
          echo "## Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Updated**:" >> $GITHUB_STEP_SUMMARY
          echo "  - GATE: exam dates, subject weightage, national cutoffs" >> $GITHUB_STEP_SUMMARY
          echo "  - JEE Main: exam dates, subject weightage, cutoffs" >> $GITHUB_STEP_SUMMARY
          echo "  - JEE Advanced: exam dates, subject weightage, cutoffs" >> $GITHUB_STEP_SUMMARY
          echo "  - CAT: exam dates, subject weightage, cutoffs" >> $GITHUB_STEP_SUMMARY
          echo "  - UPSC/CSE: exam dates, subject weightage, cutoffs" >> $GITHUB_STEP_SUMMARY
          echo "  - NEET: exam dates, subject weightage, cutoffs" >> $GITHUB_STEP_SUMMARY
          echo "  - JOSAA: IIT/NIT cutoffs" >> $GITHUB_STEP_SUMMARY
          echo "  - NIRF: college rankings" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Run**: Next Sunday at 12:00 AM UTC" >> $GITHUB_STEP_SUMMARY
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Automation Failed" >> $GITHUB_STEP_SUMMARY
          echo "The weekly automation failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
