name: Weekly Data Automation

on:
  schedule:
    # Run every Sunday at 12:00 AM UTC (5:30 AM IST)
    - cron: '0 0 * * 0'
  workflow_dispatch: # Allow manual trigger from GitHub Actions UI

jobs:
  automation:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json
      
      - name: Install dependencies
        run: |
          cd apps/web
          npm ci
      
      - name: Run GATE Exam Automation
        run: |
          cd apps/web
          npm run build
          
          # Start the server in background
          npm run dev &
          SERVER_PID=$!
          
          # Wait for server to start
          sleep 30
          
          # Trigger automation API
          curl -X POST http://localhost:3000/api/automation/gate \
            -H "Content-Type: application/json" \
            -d '{"action":"all"}' \
            || echo "Automation request failed"
          
          # Stop the server
          kill $SERVER_PID
      
      - name: Create summary
        run: |
          echo "## Automation Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Date**: $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Exams Updated**: GATE" >> $GITHUB_STEP_SUMMARY
          echo "- **Next Run**: Next Sunday at 12:00 AM UTC" >> $GITHUB_STEP_SUMMARY
      
      - name: Notify on failure
        if: failure()
        run: |
          echo "## ❌ Automation Failed" >> $GITHUB_STEP_SUMMARY
          echo "The weekly automation failed. Please check the logs above." >> $GITHUB_STEP_SUMMARY
